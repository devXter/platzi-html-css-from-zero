<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Label Alt Title</title>
</head>
<body>
<main>
    <form action="">
        <label for="name">
            <span>Cuál es tu nombre?</span>
            <input type="text" id="name">
        </label>

        <label for="started-studing">
            <span>Qué día comenzaste en Platzi?</span>
            <input type="date" id="started-studing">
        </label>

        <label for="time-to-study">
            <span>En qué horario estudias?</span>
            <input type="time" id="time-to-study">
        </label>
    </form>

    <section>
        <img
                src="medium.jpg"
                alt="Dev en notebook desarrolando una pantalla web"
                title="Dev en notebook desarrolando una pantalla web">
    </section>
</main>
</body>
</html>
