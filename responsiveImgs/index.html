<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Responsive Imgs</title>
</head>
<body>
<main>
    <picture>
        <source media="(min-width: 1100px)" srcset="imgs/large.jpg">
        <source media="(min-width: 1000px)" srcset="imgs/medium.jpg">
        <img src="imgs/small.jpg" alt="Es una imagen de ejemplo">
    </picture>
</main>
</body>
</html>
